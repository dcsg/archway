name: api
description: Production-ready Go API service with hexagonal architecture, CQRS ports, lifecycle management, and observability
language: go
version: "2.0"
variables:
  - name: ServiceName
    type: string
    description: Service name (lowercase, kebab-case)
    required: true
  - name: ModulePath
    type: string
    description: Go module path (e.g. github.com/org/service)
    required: true
  - name: GoVersion
    type: string
    description: Go version
    default: "1.24"
  - name: HasHTTP
    type: bool
    description: Include HTTP transport (Chi router)
    default: "true"
  - name: HasGRPC
    type: bool
    description: Include gRPC transport
    default: "false"
  - name: HasKafka
    type: bool
    description: Include Kafka consumer
    default: "false"
  - name: HasPostgreSQL
    type: bool
    description: Include PostgreSQL data store
    default: "false"
  - name: HasMySQL
    type: bool
    description: Include MySQL data store
    default: "false"
  - name: HasRedis
    type: bool
    description: Include Redis data store
    default: "false"
  - name: UseAuth
    type: bool
    description: Include auth middleware (JWT)
    default: "false"
  - name: HasEmail
    type: bool
    description: Include email gateway
    default: "false"
  - name: HasCORS
    type: bool
    description: Include CORS middleware
    default: "true"
  - name: HasRateLimiting
    type: bool
    description: Include rate limiting middleware
    default: "false"
  - name: HasFeatureFlags
    type: bool
    description: Include feature flags (OpenFeature pattern with memory + env providers)
    default: "false"
  - name: HasUnitTests
    type: bool
    description: Include unit test setup (table-driven)
    default: "true"
  - name: HasIntegrationTests
    type: bool
    description: Include integration test setup (testcontainers)
    default: "false"
  - name: HasTestHelpers
    type: bool
    description: Include test helpers package
    default: "true"
  - name: HasGolangCILint
    type: bool
    description: Include golangci-lint configuration
    default: "true"
  - name: HasGofumpt
    type: bool
    description: Use gofumpt (strict formatting)
    default: "true"
  - name: HasPreCommitHook
    type: bool
    description: Add pre-commit hook (lint + format)
    default: "true"
  - name: HasCommitMsgHook
    type: bool
    description: Add commit message hook (conventional commits)
    default: "false"
hooks:
  - go mod tidy
  - git init
