name: cli
description: Go CLI application with minimal structure
language: go
version: "1.0"
variables:
  - name: ServiceName
    type: string
    description: Service directory name
    required: true
  - name: ModulePath
    type: string
    description: Go module path
    required: true
  - name: HasUnitTests
    type: bool
    description: Include unit test setup (table-driven)
    default: "true"
  - name: HasTestHelpers
    type: bool
    description: Include test helpers package
    default: "false"
  - name: HasGolangCILint
    type: bool
    description: Include golangci-lint configuration
    default: "true"
  - name: HasGofumpt
    type: bool
    description: Use gofumpt (strict formatting)
    default: "true"
  - name: HasPreCommitHook
    type: bool
    description: Add pre-commit hook (lint + format)
    default: "false"
  - name: HasCommitMsgHook
    type: bool
    description: Add commit message hook (conventional commits)
    default: "false"
hooks:
  - go mod tidy
